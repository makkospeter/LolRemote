name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '1.3.0' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Portable LolRemote.exe
        run: >
          dotnet publish src/LolRemote.Companion -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }} -o out/portable

      - name: Files for the installer
        run: >
          dotnet publish src/LolRemote.Companion -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }} -o out/app

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" installer\LolRemote.iss
          Copy-Item out/portable/LolRemote.exe out/LolRemote.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LolRemote
          path: |
            out/LolRemote-Setup.exe
            out/LolRemote.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/LolRemote-Setup.exe
            out/LolRemote.exe
          generate_release_notes: true
